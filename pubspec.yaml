name: myming_pedometer
description: 마이밍 만보기 리워드 앱 - 걸을수록 월세가 내려가는 서비스
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 상태관리
  provider: ^6.1.1

  # 만보기 (실기기 전용)
  pedometer: ^4.0.2

  # 구글 폰트 (Noto Sans KR)
  google_fonts: ^6.1.0

  # 로컬 저장소 (토큰, 캐시)
  shared_preferences: ^2.2.2

  # HTTP 클라이언트 (백엔드 API 연동)
  dio: ^5.4.3

  # 게임 엔진 (벽돌깨기, 무한점프, 낚시대전)
  flame: ^1.18.0

  # WebView (HTML 게임 임베드)
  webview_flutter: ^4.7.0

  # 공유하기 (링크 복사 · 카카오톡 등 외부 앱 공유)
  share_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/games/
    - assets/images/
