<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SNAKE GAME</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
button{touch-action:manipulation;}
html,body{height:100%;overflow:hidden;background:#05091a;}
body{display:flex;flex-direction:column;}
.scr{display:none;flex-direction:column;align-items:center;justify-content:space-evenly;width:100%;flex:1;padding:24px 20px;}
.scr.on{display:flex;}
#scrGame{align-items:stretch;justify-content:flex-start;padding:0;}
#ui{flex-shrink:0;display:flex;justify-content:space-between;padding:10px 16px;background:rgba(5,9,26,.95);}
#ui span{color:#27AE60;font-size:12px;font-weight:900;font-family:monospace;}
#gameArea{flex:1;position:relative;overflow:hidden;}
canvas{display:block;touch-action:none;position:absolute;top:0;left:0;width:100%;height:100%;}
#dpad{flex-shrink:0;display:none;height:150px;align-items:center;justify-content:center;background:rgba(5,9,26,.95);padding:8px 0;}
#dpad.active{display:flex;}
.dpad-inner{display:flex;flex-direction:column;align-items:center;gap:6px;}
.dpad-row{display:flex;gap:6px;}
.dpad-btn{width:62px;height:62px;background:rgba(39,174,96,.25);border:2px solid #27AE60;border-radius:14px;color:#27AE60;font-size:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation;}
#waitHint{position:absolute;bottom:8px;left:0;right:0;text-align:center;color:rgba(39,174,96,.6);font-size:11px;font-family:monospace;pointer-events:none;}
.big-icon{font-size:80px;line-height:1;}
h1{color:#27AE60;font-size:26px;font-family:monospace;font-weight:900;text-align:center;line-height:1.5;}
p{color:#888;font-size:13px;text-align:center;line-height:1.9;}
.rank-box{width:100%;max-width:320px;font-size:12px;color:#5a8ab0;text-align:center;}
.btn{font-size:14px;color:#fff;background:#27AE60;border:none;padding:18px 0;cursor:pointer;border-radius:12px;font-weight:900;width:100%;max-width:320px;}
.rbtn{font-size:12px;color:#5a8ab0;background:#1a3a5c;border:none;padding:14px 0;cursor:pointer;border-radius:12px;font-weight:700;width:100%;max-width:320px;}
.res{font-size:15px;color:#27AE60;font-weight:900;}
</style>
</head>
<body>

<div id="scrTitle" class="scr on">
  <div class="big-icon">🐍</div>
  <h1>SNAKE<br>GAME!</h1>
  <p>먹이를 먹어 뱀을 키워라!<br>방향키 또는 스와이프로 조작!</p>
  <div class="rank-box" id="topRankTitle"></div>
  <button class="btn" ontouchend="event.preventDefault();startGame()" onclick="startGame()">▶ START</button>
  <button class="rbtn" ontouchend="event.preventDefault();goBack()" onclick="goBack()">← MENU</button>
</div>

<div id="scrGame" class="scr">
  <div id="ui"><span>🐍 SNAKE</span><span id="scoreEl">길이: 3</span></div>
  <div id="gameArea">
    <canvas id="c"></canvas>
    <div id="waitHint" style="display:none;">방향키를 눌러 시작하세요!</div>
  </div>
  <div id="dpad">
    <div class="dpad-inner">
      <div class="dpad-row"><div class="dpad-btn" ontouchend="event.preventDefault();dir(0,-1)" onclick="dir(0,-1)">↑</div></div>
      <div class="dpad-row">
        <div class="dpad-btn" ontouchend="event.preventDefault();dir(-1,0)" onclick="dir(-1,0)">←</div>
        <div class="dpad-btn" ontouchend="event.preventDefault();dir(0,1)" onclick="dir(0,1)">↓</div>
        <div class="dpad-btn" ontouchend="event.preventDefault();dir(1,0)" onclick="dir(1,0)">→</div>
      </div>
    </div>
  </div>
</div>

<div id="scrResult" class="scr">
  <div class="big-icon">🐍</div>
  <h1>GAME OVER!</h1>
  <div class="res" id="resLen"></div>
  <div id="resEarn" style="font-size:16px;color:#27AE60;font-weight:900;"></div>
  <div id="resRank" style="font-size:13px;color:#FFD700;"></div>
  <div class="rank-box" id="rankList"></div>
  <button class="btn" ontouchend="event.preventDefault();startGame()" onclick="startGame()">▶ RETRY</button>
  <button class="rbtn" ontouchend="event.preventDefault();goBack()" onclick="goBack()">← MENU</button>
</div>

<script>
function scr(id){document.querySelectorAll('.scr').forEach(s=>s.classList.remove('on'));document.getElementById(id).classList.add('on');}

const DUMMY=[{name:'뱀왕',l:24},{name:'뱀신',l:20},{name:'기다란뱀',l:16},{name:'중간뱀',l:12},{name:'아기뱀',l:8}];
function getRanks(){try{const d=JSON.parse(localStorage.getItem('mmSnakeRanks')||'null');if(d&&d.length)return d;}catch(e){}return DUMMY.slice();}
function saveRank(l){const r=getRanks().filter(x=>x.name!=='YOU');r.push({name:'YOU',l});r.sort((a,b)=>b.l-a.l);const t=r.slice(0,10);localStorage.setItem('mmSnakeRanks',JSON.stringify(t));return t.findIndex(x=>x.name==='YOU')+1;}
function renderRanks(el){if(!el)return;const r=getRanks();const md=['🥇','🥈','🥉'];el.innerHTML=r.slice(0,5).map((x,i)=>`<div style="padding:4px 0;border-bottom:1px solid #1a3a5c;">${md[i]||i+1} ${x.name} <span style="color:#fff">길이 ${x.l}</span></div>`).join('');}

const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
let COLS,ROWS,CS,GX,GY,GW,GH;
let snake,dx,dy,food,running,tickInterval,waiting;
let touchSX,touchSY;

function resize(){
  const ga=document.getElementById('gameArea');
  const dpr=window.devicePixelRatio||1;
  const cssW=ga.clientWidth||window.innerWidth;
  const cssH=ga.clientHeight||(window.innerHeight-44-150);
  cv.width=Math.round(cssW*dpr);cv.height=Math.round(cssH*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  CS=Math.floor(Math.min(cssW,cssH)/18);if(CS<12)CS=12;
  COLS=Math.floor(cssW/CS);ROWS=Math.floor(cssH/CS);
  GW=COLS*CS;GH=ROWS*CS;
  GX=Math.floor((cssW-GW)/2);GY=Math.floor((cssH-GH)/2);
}

function placeFood(){
  let fx,fy;
  do{fx=Math.floor(Math.random()*COLS);fy=Math.floor(Math.random()*ROWS);}
  while(snake.some(s=>s.x===fx&&s.y===fy));
  food={x:fx,y:fy};
}

function startGame(){
  scr('scrGame');
  document.getElementById('dpad').classList.add('active');
  document.getElementById('waitHint').style.display='block';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    resize();
    const cx=Math.floor(COLS/2),cy=Math.floor(ROWS/2);
    snake=[{x:cx,y:cy},{x:cx-1,y:cy},{x:cx-2,y:cy}];
    dx=0;dy=0;waiting=true;running=true;
    placeFood();
    if(tickInterval)clearInterval(tickInterval);
    tickInterval=setInterval(tick,150);
    draw();
  }));
}

function dir(ndx,ndy){
  if(!running)return;
  if(ndx!==0&&dx!==0&&ndx===-dx)return;
  if(ndy!==0&&dy!==0&&ndy===-dy)return;
  if(waiting){waiting=false;document.getElementById('waitHint').style.display='none';}
  dx=ndx;dy=ndy;
}

function tick(){
  if(!running||waiting)return;
  const head={x:snake[0].x+dx,y:snake[0].y+dy};
  if(head.x<0||head.x>=COLS||head.y<0||head.y>=ROWS){endGame();return;}
  if(snake.some(s=>s.x===head.x&&s.y===head.y)){endGame();return;}
  snake.unshift(head);
  if(head.x===food.x&&head.y===food.y){placeFood();}else snake.pop();
  document.getElementById('scoreEl').textContent='길이: '+snake.length;
  draw();
}

function draw(){
  ctx.fillStyle='#05091a';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.strokeStyle='rgba(39,174,96,.2)';ctx.lineWidth=0.5;
  for(let r=0;r<=ROWS;r++){ctx.beginPath();ctx.moveTo(GX,GY+r*CS);ctx.lineTo(GX+GW,GY+r*CS);ctx.stroke();}
  for(let c=0;c<=COLS;c++){ctx.beginPath();ctx.moveTo(GX+c*CS,GY);ctx.lineTo(GX+c*CS,GY+GH);ctx.stroke();}
  snake.forEach((s,i)=>{
    ctx.fillStyle=i===0?'#27AE60':'rgba(39,174,96,0.7)';
    ctx.beginPath();ctx.roundRect(GX+s.x*CS+1,GY+s.y*CS+1,CS-2,CS-2,i===0?5:3);ctx.fill();
    if(i===0){
      ctx.fillStyle='#fff';
      const ex=dx===1?0.7:dx===-1?0.3:0.5,ey=dy===1?0.7:dy===-1?0.3:0.5;
      ctx.beginPath();ctx.arc(GX+s.x*CS+CS*ex,GY+s.y*CS+CS*ey,CS*0.12,0,Math.PI*2);ctx.fill();
    }
  });
  ctx.font=Math.max(CS-4,12)+'px serif';ctx.textAlign='center';
  ctx.fillText('🍎',GX+food.x*CS+CS/2,GY+food.y*CS+CS*0.8);
}

function endGame(){
  running=false;clearInterval(tickInterval);
  document.getElementById('dpad').classList.remove('active');
  document.getElementById('waitHint').style.display='none';
  const len=snake.length,earn=Math.min(Math.floor(len*2),32),rank=saveRank(len);
  document.getElementById('resLen').textContent='길이: '+len;
  document.getElementById('resEarn').textContent='+₩'+earn+' 적립!';
  document.getElementById('resRank').textContent='🏆 '+rank+'위';
  renderRanks(document.getElementById('rankList'));
  scr('scrResult');
  if(earn>0&&typeof GameChannel!=='undefined')GameChannel.postMessage(earn.toString());
}

function goBack(){running=false;clearInterval(tickInterval);if(typeof GameChannel!=='undefined')GameChannel.postMessage('back');}

const ga=document.getElementById('gameArea');
ga.addEventListener('touchstart',e=>{touchSX=e.touches[0].clientX;touchSY=e.touches[0].clientY;},{passive:true});
ga.addEventListener('touchend',e=>{
  const ddx=e.changedTouches[0].clientX-touchSX,ddy=e.changedTouches[0].clientY-touchSY;
  if(Math.abs(ddx)>Math.abs(ddy)){if(Math.abs(ddx)>30)dir(ddx>0?1:-1,0);}
  else{if(Math.abs(ddy)>30)dir(0,ddy>0?1:-1);}
},{passive:true});

renderRanks(document.getElementById('topRankTitle'));
</script>
</body>
</html>
