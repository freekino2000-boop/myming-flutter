<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BRICK BREAKER</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:#05091a;}
body{display:flex;flex-direction:column;font-family:'Press Start 2P',monospace;}
.scr{display:none;flex-direction:column;align-items:center;justify-content:space-evenly;width:100%;flex:1;padding:24px 20px;}
.scr.on{display:flex;}
#scrGame{align-items:stretch;justify-content:flex-start;padding:0;}
#ui{flex-shrink:0;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:rgba(5,9,26,.9);}
#ui span{color:#FF6B35;font-size:12px;font-family:monospace;font-weight:900;}
canvas{display:block;touch-action:none;width:100%;flex:1;}
.big-icon{font-size:80px;line-height:1;}
h1{color:#FF6B35;font-size:26px;font-weight:900;text-align:center;line-height:1.5;}
p{color:#888;font-size:13px;text-align:center;line-height:1.9;}
.rank-box{width:100%;max-width:320px;font-size:12px;color:#5a8ab0;text-align:center;}
.btn{font-size:14px;color:#fff;background:#FF6B35;border:none;padding:18px 0;cursor:pointer;border-radius:12px;font-weight:900;width:100%;max-width:320px;}
.rbtn{font-size:12px;color:#5a8ab0;background:#1a3a5c;border:none;padding:14px 0;cursor:pointer;border-radius:12px;font-weight:700;width:100%;max-width:320px;}
.res{font-size:15px;color:#FF6B35;font-weight:900;}
</style>
</head>
<body>

<div id="scrTitle" class="scr on">
  <div class="big-icon">🧱</div>
  <h1>BRICK<br>BREAKER!</h1>
  <p>공이 떨어지지 않게 막고<br>모든 벽돌을 깨라!</p>
  <div class="rank-box" id="topRankTitle"></div>
  <button class="btn" ontouchend="event.preventDefault();startGame()" onclick="startGame()">▶ START</button>
  <button class="rbtn" ontouchend="event.preventDefault();goBack()" onclick="goBack()">← MENU</button>
</div>

<div id="scrGame" class="scr">
  <div id="ui"><span>🧱 BRICK BREAKER</span><span id="scoreEl">SCORE: 0</span></div>
  <canvas id="c"></canvas>
</div>

<div id="scrResult" class="scr">
  <div class="big-icon">🧱</div>
  <h1 id="resTitle">CLEAR!</h1>
  <div class="res" id="resScore"></div>
  <div id="resEarn" style="font-size:16px;color:#FF6B35;font-weight:900;"></div>
  <div id="resRank" style="font-size:13px;color:#FFD700;"></div>
  <div class="rank-box" id="rankList"></div>
  <button class="btn" ontouchend="event.preventDefault();startGame()" onclick="startGame()">▶ RETRY</button>
  <button class="rbtn" ontouchend="event.preventDefault();goBack()" onclick="goBack()">← MENU</button>
</div>

<script>
function scr(id){document.querySelectorAll('.scr').forEach(s=>s.classList.remove('on'));document.getElementById(id).classList.add('on');}

const DUMMY=[{name:'벽돌왕',s:720},{name:'브레이커',s:640},{name:'공튀김',s:560},{name:'파괴자',s:480},{name:'도전자A',s:360}];
function getRanks(){try{const d=JSON.parse(localStorage.getItem('mmBrickRanks')||'null');if(d&&d.length)return d;}catch(e){}return DUMMY.slice();}
function saveRank(s){const r=getRanks().filter(x=>x.name!=='YOU');r.push({name:'YOU',s});r.sort((a,b)=>b.s-a.s);const t=r.slice(0,10);localStorage.setItem('mmBrickRanks',JSON.stringify(t));return t.findIndex(x=>x.name==='YOU')+1;}
function renderRanks(el){if(!el)return;const r=getRanks();const md=['🥇','🥈','🥉'];el.innerHTML=r.slice(0,5).map((x,i)=>`<div style="padding:4px 0;border-bottom:1px solid #1a3a5c;">${md[i]||i+1} ${x.name} <span style="color:#fff">${x.s}점</span></div>`).join('');}

const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
let W,H,PAD_W,PAD_H,BALL_R,BRICK_ROWS,BRICK_COLS,brickW,brickH;
let padX,ballX,ballY,bvx,bvy,score,lives,bricks,running;
let touchX=null;

function resize(){
  const dpr=window.devicePixelRatio||1;
  W=cv.clientWidth||window.innerWidth;
  H=cv.clientHeight||(window.innerHeight-44);
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  PAD_W=Math.min(W*0.22,90);PAD_H=10;BALL_R=7;
  BRICK_ROWS=5;BRICK_COLS=7;
  brickW=(W-20)/(BRICK_COLS+0.5);brickH=22;
}

function startGame(){
  scr('scrGame');
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    resize();
    padX=W/2-PAD_W/2;ballX=W/2;ballY=H-80;
    const spd=5.5,ang=(Math.random()*0.6+0.2)*Math.PI;
    bvx=spd*Math.cos(ang)*(Math.random()>0.5?1:-1);bvy=-spd*Math.abs(Math.sin(ang));
    score=0;lives=3;running=true;
    bricks=[];
    const colors=['#FF6B35','#FF9F43','#F5A623','#FFD043','#E8D44D'];
    for(let r=0;r<BRICK_ROWS;r++)for(let c=0;c<BRICK_COLS;c++)bricks.push({x:10+c*(brickW+3),y:60+r*(brickH+5),alive:true,color:colors[r]});
    document.getElementById('scoreEl').textContent='SCORE: 0';
    requestAnimationFrame(loop);
  }));
}

function loop(){if(!running)return;update();draw();requestAnimationFrame(loop);}

function update(){
  if(touchX!==null)padX=Math.max(0,Math.min(W-PAD_W,touchX-PAD_W/2));
  ballX+=bvx;ballY+=bvy;
  if(ballX-BALL_R<0){ballX=BALL_R;bvx=Math.abs(bvx);}
  if(ballX+BALL_R>W){ballX=W-BALL_R;bvx=-Math.abs(bvx);}
  if(ballY-BALL_R<0){ballY=BALL_R;bvy=Math.abs(bvy);}
  const py=H-40;
  if(ballY+BALL_R>=py&&ballY+BALL_R<=py+PAD_H&&ballX>=padX&&ballX<=padX+PAD_W){
    bvy=-Math.abs(bvy);const rel=(ballX-(padX+PAD_W/2))/(PAD_W/2);bvx=rel*7;
    const spd=Math.sqrt(bvx*bvx+bvy*bvy);if(spd>8){bvx=bvx/spd*8;bvy=bvy/spd*8;}
  }
  for(let b of bricks){
    if(!b.alive)continue;
    if(ballX+BALL_R>b.x&&ballX-BALL_R<b.x+brickW-3&&ballY+BALL_R>b.y&&ballY-BALL_R<b.y+brickH){
      b.alive=false;score+=10;document.getElementById('scoreEl').textContent='SCORE: '+score;
      if(Math.abs(ballY-b.y)<Math.abs(ballX-b.x))bvx=-bvx;else bvy=-bvy;
    }
  }
  if(ballY-BALL_R>H){lives--;if(lives<=0){endGame(false);return;}ballX=W/2;ballY=H-80;bvy=-5.5;bvx=(Math.random()-0.5)*6;}
  if(bricks.every(b=>!b.alive)){endGame(true);return;}
}

function draw(){
  ctx.fillStyle='#05091a';ctx.fillRect(0,0,W,H);
  for(let b of bricks){if(!b.alive)continue;ctx.fillStyle=b.color;ctx.beginPath();ctx.roundRect(b.x,b.y,brickW-3,brickH,3);ctx.fill();}
  const py=H-40;ctx.fillStyle='#FF6B35';ctx.beginPath();ctx.roundRect(padX,py,PAD_W,PAD_H,5);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ballX,ballY,BALL_R,0,Math.PI*2);ctx.fill();
  for(let i=0;i<lives;i++){ctx.fillStyle='#FF6B35';ctx.beginPath();ctx.arc(W-20-i*18,H-10,5,0,Math.PI*2);ctx.fill();}
}

function endGame(win){
  running=false;
  const earn=Math.min(Math.floor(score/10),90);const rank=saveRank(score);
  document.getElementById('resTitle').textContent=win?'🎉 CLEAR!':'💥 GAME OVER';
  document.getElementById('resScore').textContent='SCORE: '+score+'점';
  document.getElementById('resEarn').textContent='+₩'+earn+' 적립!';
  document.getElementById('resRank').textContent='🏆 '+rank+'위';
  renderRanks(document.getElementById('rankList'));scr('scrResult');
  if(earn>0&&typeof GameChannel!=='undefined')GameChannel.postMessage(earn.toString());
}

function goBack(){running=false;if(typeof GameChannel!=='undefined')GameChannel.postMessage('back');}

cv.addEventListener('touchstart',e=>{touchX=e.touches[0].clientX;},{passive:true});
cv.addEventListener('touchmove',e=>{e.preventDefault();touchX=e.touches[0].clientX;},{passive:false});
cv.addEventListener('touchend',()=>{touchX=null;},{passive:true});
renderRanks(document.getElementById('topRankTitle'));
window.addEventListener('resize',()=>{if(running)resize();});
</script>
</body>
</html>
