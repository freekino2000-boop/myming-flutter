<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BRICK BREAKER</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
button{touch-action:manipulation;}
body{background:#05091a;overflow:hidden;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Press Start 2P',monospace;}
canvas{display:block;touch-action:none;}
#ui{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:rgba(5,9,26,.9);z-index:10;}
#ui span{color:#FF6B35;font-size:11px;font-family:monospace;font-weight:900;}
.overlay{position:fixed;inset:0;background:rgba(5,9,26,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:20;}
.overlay h1{color:#FF6B35;font-size:20px;font-family:monospace;font-weight:900;text-align:center;}
.overlay p{color:#888;font-size:12px;text-align:center;line-height:1.8;}
.btn{font-size:12px;color:#fff;background:#FF6B35;border:none;padding:13px 30px;cursor:pointer;border-radius:8px;font-weight:900;}
.rbtn{font-size:11px;color:#5a8ab0;background:#1a3a5c;border:none;padding:10px 20px;cursor:pointer;border-radius:8px;font-weight:700;}
.res{font-size:13px;color:#FF6B35;font-weight:900;}
</style>
</head>
<body>
<div id="ui"><span>🧱 BRICK BREAKER</span><span id="scoreEl">SCORE: 0</span></div>
<canvas id="c"></canvas>

<!-- 타이틀 -->
<div class="overlay" id="ovTitle">
  <h1>🧱 BRICK<br>BREAKER!</h1>
  <p>공이 떨어지지 않게 막고<br>모든 벽돌을 깨라!</p>
  <div id="topRankTitle" style="font-size:11px;color:#5a8ab0;text-align:center;margin-bottom:4px;"></div>
  <button class="btn" ontouchend="event.preventDefault();startGame()" onclick="startGame()">▶ START</button>
  <button class="rbtn" ontouchend="event.preventDefault();goBack()" onclick="goBack()">← MENU</button>
</div>

<!-- 결과 -->
<div class="overlay" id="ovResult" style="display:none;">
  <h1 id="resTitle">CLEAR!</h1>
  <div class="res" id="resScore"></div>
  <div id="resEarn" style="font-size:14px;color:#FF6B35;font-weight:900;"></div>
  <div id="resRank" style="font-size:11px;color:#FFD700;"></div>
  <div id="rankList" style="font-size:10px;color:#5a8ab0;text-align:left;min-width:200px;margin-top:4px;"></div>
  <button class="btn" ontouchend="event.preventDefault();startGame()" onclick="startGame()">▶ RETRY</button>
  <button class="rbtn" ontouchend="event.preventDefault();goBack()" onclick="goBack()">← MENU</button>
</div>

<script>
const DUMMY=[{name:'벽돌왕',s:720},{name:'브레이커',s:640},{name:'공튀김',s:560},{name:'파괴자',s:480},{name:'도전자A',s:360}];
function getRanks(){try{const d=JSON.parse(localStorage.getItem('mmBrickRanks')||'null');if(d&&d.length)return d;}catch(e){}return DUMMY.slice();}
function saveRank(s){const r=getRanks().filter(x=>x.name!=='YOU');r.push({name:'YOU',s});r.sort((a,b)=>b.s-a.s);const t=r.slice(0,10);localStorage.setItem('mmBrickRanks',JSON.stringify(t));return t.findIndex(x=>x.name==='YOU')+1;}
function renderRanks(el){if(!el)return;const r=getRanks();const md=['🥇','🥈','🥉'];el.innerHTML=r.slice(0,5).map((x,i)=>`<div style="padding:3px 0;border-bottom:1px solid #1a3a5c;">${md[i]||i+1} ${x.name} <span style="color:#fff">${x.s}점</span></div>`).join('');}

const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
let W,H,PAD_W,PAD_H,BALL_R,BRICK_ROWS,BRICK_COLS,brickW,brickH;
let padX,ballX,ballY,bvx,bvy,score,lives,bricks,running,started;
let touchX=null;

function resize(){
  W=cv.width=window.innerWidth;
  H=cv.height=window.innerHeight-44;
  PAD_W=Math.min(W*0.22,90);PAD_H=10;BALL_R=7;
  BRICK_ROWS=5;BRICK_COLS=7;
  brickW=(W-20)/(BRICK_COLS+0.5);brickH=22;
}

function initBricks(){
  bricks=[];
  const colors=['#FF6B35','#FF9F43','#F5A623','#FFD043','#E8D44D'];
  for(let r=0;r<BRICK_ROWS;r++)
    for(let c=0;c<BRICK_COLS;c++)
      bricks.push({x:10+c*(brickW+3),y:60+r*(brickH+5),alive:true,color:colors[r]});
}

function startGame(){
  document.getElementById('ovTitle').style.display='none';
  document.getElementById('ovResult').style.display='none';
  resize();
  padX=W/2-PAD_W/2;
  ballX=W/2;ballY=H-80;
  const spd=5.5;const ang=(Math.random()*0.6+0.2)*Math.PI;
  bvx=spd*Math.cos(ang)*(Math.random()>0.5?1:-1);bvy=-spd*Math.abs(Math.sin(ang));
  score=0;lives=3;running=true;started=true;
  initBricks();
  document.getElementById('scoreEl').textContent='SCORE: 0';
  requestAnimationFrame(loop);
}

function loop(){
  if(!running)return;
  update();draw();
  requestAnimationFrame(loop);
}

function update(){
  // 패들 이동
  if(touchX!==null){padX=Math.max(0,Math.min(W-PAD_W,touchX-PAD_W/2));}

  ballX+=bvx;ballY+=bvy;

  // 벽 반사
  if(ballX-BALL_R<0){ballX=BALL_R;bvx=Math.abs(bvx);}
  if(ballX+BALL_R>W){ballX=W-BALL_R;bvx=-Math.abs(bvx);}
  if(ballY-BALL_R<44){ballY=44+BALL_R;bvy=Math.abs(bvy);}

  // 패들 충돌
  const py=H-40;
  if(ballY+BALL_R>=py&&ballY+BALL_R<=py+PAD_H&&ballX>=padX&&ballX<=padX+PAD_W){
    bvy=-Math.abs(bvy);
    const rel=(ballX-(padX+PAD_W/2))/(PAD_W/2);
    bvx=rel*7;
    const spd=Math.sqrt(bvx*bvx+bvy*bvy);
    if(spd>8){bvx=bvx/spd*8;bvy=bvy/spd*8;}
  }

  // 벽돌 충돌
  for(let b of bricks){
    if(!b.alive)continue;
    if(ballX+BALL_R>b.x&&ballX-BALL_R<b.x+brickW-3&&ballY+BALL_R>b.y&&ballY-BALL_R<b.y+brickH){
      b.alive=false;score+=10;
      document.getElementById('scoreEl').textContent='SCORE: '+score;
      if(Math.abs(ballY-b.y)<Math.abs(ballX-b.x))bvx=-bvx;else bvy=-bvy;
    }
  }

  // 공 낙하
  if(ballY-BALL_R>H){
    lives--;
    if(lives<=0){endGame(false);return;}
    ballX=W/2;ballY=H-80;bvy=-5.5;bvx=(Math.random()-0.5)*6;
  }

  // 클리어
  if(bricks.every(b=>!b.alive)){endGame(true);return;}
}

function draw(){
  ctx.fillStyle='#05091a';ctx.fillRect(0,0,W,H);
  // 벽돌
  for(let b of bricks){
    if(!b.alive)continue;
    ctx.fillStyle=b.color;
    ctx.beginPath();ctx.roundRect(b.x,b.y,brickW-3,brickH,3);ctx.fill();
  }
  // 패들
  const py=H-40;
  ctx.fillStyle='#FF6B35';
  ctx.beginPath();ctx.roundRect(padX,py,PAD_W,PAD_H,5);ctx.fill();
  // 공
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(ballX,ballY,BALL_R,0,Math.PI*2);ctx.fill();
  // 목숨
  for(let i=0;i<lives;i++){
    ctx.fillStyle='#FF6B35';ctx.beginPath();ctx.arc(W-20-i*18,H-10,5,0,Math.PI*2);ctx.fill();
  }
}

function endGame(win){
  running=false;
  const earn=Math.min(Math.floor(score/10),90);
  const rank=saveRank(score);
  document.getElementById('resTitle').textContent=win?'🎉 CLEAR!':'💥 GAME OVER';
  document.getElementById('resScore').textContent='SCORE: '+score+'점';
  document.getElementById('resEarn').textContent='+₩'+earn+' 적립!';
  document.getElementById('resRank').textContent='🏆 '+rank+'위';
  renderRanks(document.getElementById('rankList'));
  document.getElementById('ovResult').style.display='flex';
  if(earn>0&&typeof GameChannel!=='undefined')GameChannel.postMessage(earn.toString());
}

function goBack(){if(typeof GameChannel!=='undefined')GameChannel.postMessage('back');}

// 터치 제어 (패들)
cv.addEventListener('touchstart',e=>{touchX=e.touches[0].clientX;},{ passive:true});
cv.addEventListener('touchmove',e=>{e.preventDefault();touchX=e.touches[0].clientX;},{passive:false});
cv.addEventListener('touchend',()=>{touchX=null;},{passive:true});

// 랭킹 초기 렌더
renderRanks(document.getElementById('topRankTitle'));
window.addEventListener('resize',()=>{if(running)resize();});
</script>
</body>
</html>
