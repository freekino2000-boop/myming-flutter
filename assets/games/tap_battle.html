<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>TAP BATTLE</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:#05091a;font-family:'Press Start 2P',monospace;overflow:hidden;height:100vh;display:flex;flex-direction:column;}
.scr{display:none;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;padding:20px;}
.scr.on{display:flex;}
.logo{font-size:22px;color:#2C7FFF;text-shadow:3px 3px #0a3a8a;margin-bottom:10px;text-align:center;line-height:1.8;}
.timer{font-size:54px;color:#2C7FFF;text-shadow:0 0 20px #2C7FFF;margin-bottom:6px;min-width:60px;text-align:center;}
.count{font-size:70px;color:#fff;margin-bottom:4px;min-width:80px;text-align:center;}
.label{font-size:9px;color:#5a8ab0;margin-bottom:20px;}
.tap-btn{width:170px;height:170px;border-radius:50%;background:#2C7FFF;border:none;font-size:22px;cursor:pointer;box-shadow:0 0 40px rgba(44,127,255,.6);color:#fff;font-family:'Press Start 2P',monospace;transition:transform .06s,box-shadow .06s;user-select:none;-webkit-user-select:none;}
.tap-btn:active{transform:scale(.9);box-shadow:0 0 15px rgba(44,127,255,.3);}
.start-btn{font-family:'Press Start 2P',monospace;font-size:11px;color:#fff;background:#2C7FFF;border:none;padding:13px 30px;cursor:pointer;box-shadow:4px 4px #0a3a8a;margin-top:10px;}
.rank-row{display:flex;align-items:center;gap:8px;font-size:9px;color:#5a8ab0;padding:5px 0;border-bottom:1px solid #1a3a5c;width:100%;max-width:280px;}
.rank-row.me{color:#2C7FFF;}
.rank-num{width:26px;text-align:right;flex-shrink:0;}
.rank-name{flex:1;}
.rank-score{color:#fff;white-space:nowrap;}
.rbtn{font-family:'Press Start 2P',monospace;font-size:9px;padding:10px 14px;border:none;cursor:pointer;margin:3px;}
.res-sub{font-size:9px;color:#888;line-height:2.5;text-align:center;}
.res-earn{font-size:14px;color:#2C7FFF;}
.res-rank{font-size:10px;color:#FFD700;}
</style>
</head>
<body>
<!-- 타이틀 화면 -->
<div class="scr on" id="scrTitle">
  <div class="logo">⚡ TAP<br>BATTLE!</div>
  <div style="font-size:9px;color:#5a8ab0;margin:8px 0 18px;text-align:center;line-height:2.2;">10초 안에 최대한<br>많이 탭하라!</div>
  <div id="topRanks" style="width:100%;max-width:280px;margin-bottom:18px;"></div>
  <button class="start-btn" onclick="tapStart()">▶ START</button>
  <button class="rbtn" style="background:#1a3a5c;color:#5a8ab0;margin-top:16px;" onclick="goBack()">← MENU</button>
</div>

<!-- 게임 화면 -->
<div class="scr" id="scrGame">
  <div class="timer" id="timerEl">10</div>
  <div class="count" id="countEl">0</div>
  <div class="label">TAPS</div>
  <button class="tap-btn" id="tapBtn" ontouchstart="tapDo(event)" onclick="tapDo(event)">TAP!</button>
</div>

<!-- 결과 화면 -->
<div class="scr" id="scrResult" style="gap:8px;">
  <div style="font-size:18px;color:#2C7FFF;">RESULT!</div>
  <div id="resSub" class="res-sub"></div>
  <div id="resEarn" class="res-earn"></div>
  <div id="resRank" class="res-rank"></div>
  <div id="rankList" style="width:100%;max-width:280px;margin:6px 0;"></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;">
    <button class="rbtn" style="background:#2C7FFF;color:#fff;" onclick="tapStart()">▶ RETRY</button>
    <button class="rbtn" style="background:#1a3a5c;color:#5a8ab0;" onclick="goBack()">← MENU</button>
  </div>
</div>

<script>
const DUMMY=[{name:'탭마스터',taps:191},{name:'빠른손쇼',taps:175},{name:'탭킹222',taps:162},{name:'클릭신화',taps:151},{name:'연타왕자',taps:139},{name:'스피드러',taps:123}];
let timer=null, count=0, sec=0, touched=false;

function getRanks(){
  try{const s=JSON.parse(localStorage.getItem('mmTapRanks')||'null');if(s&&s.length)return s;}catch(e){}
  localStorage.setItem('mmTapRanks',JSON.stringify(DUMMY));return DUMMY.slice();
}
function saveRank(taps){
  const ranks=getRanks().filter(r=>r.name!=='YOU');
  ranks.push({name:'YOU',taps});
  ranks.sort((a,b)=>b.taps-a.taps);
  const top=ranks.slice(0,10);
  localStorage.setItem('mmTapRanks',JSON.stringify(top));
  return top.findIndex(r=>r.name==='YOU')+1;
}
function renderRanks(el){
  if(!el)return;
  const ranks=getRanks();
  const md=['🥇','🥈','🥉'];
  el.innerHTML=ranks.slice(0,6).map((r,i)=>
    `<div class="rank-row${r.name==='YOU'?' me':''}"><span class="rank-num">${md[i]||i+1}</span><span class="rank-name">${r.name}${r.name==='YOU'?' ◀':''}</span><span class="rank-score">${r.taps}회</span></div>`
  ).join('');
}
function scr(id){document.querySelectorAll('.scr').forEach(s=>s.classList.remove('on'));document.getElementById(id).classList.add('on');}
function tapStart(){
  count=0;sec=10;touched=false;
  document.getElementById('countEl').textContent='0';
  const te=document.getElementById('timerEl');
  te.textContent='10';te.style.color='#2C7FFF';
  scr('scrGame');
  if(timer)clearInterval(timer);
  timer=setInterval(()=>{sec--;te.textContent=sec;if(sec<=3)te.style.color='#FF4444';if(sec<=0){clearInterval(timer);timer=null;tapFinish();}},1000);
}
function tapDo(e){
  if(e&&e.type==='touchstart'){e.preventDefault();if(touched){touched=false;return;}touched=true;}
  if(sec<=0)return;
  count++;
  document.getElementById('countEl').textContent=count;
  const btn=document.getElementById('tapBtn');
  btn.style.transform='scale(0.88)';
  setTimeout(()=>{btn.style.transform='';},70);
}
function tapFinish(){
  const earn=Math.min(Math.floor(count/4),50);
  const rank=saveRank(count);
  document.getElementById('resSub').innerHTML='TAP COUNT : '+count+'<br>EARN : +₩'+earn+'<br>MY RANK : '+rank+'위';
  document.getElementById('resEarn').textContent='+₩'+earn+' 적립!';
  document.getElementById('resRank').textContent='🏆 '+rank+'위 / '+getRanks().length+'명';
  renderRanks(document.getElementById('rankList'));
  scr('scrResult');
  if(earn>0&&typeof GameChannel!=='undefined')GameChannel.postMessage(earn.toString());
}
function goBack(){if(typeof GameChannel!=='undefined')GameChannel.postMessage('back');}

renderRanks(document.getElementById('topRanks'));
</script>
</body>
</html>
